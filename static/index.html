<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotify Pins</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">

    <!-- LEFT PANEL: filters -->
    <aside class="panel sidebar">
      <h1 class="logo">🎧 Spotify Pins</h1>

      <div class="sync-row">
        <button class="sync-btn" id="sync-btn" title="Fetch your latest playlists from Spotify">
          <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          Sync library
        </button>
        <span class="sync-msg" id="sync-msg"></span>
      </div>

      <label class="field">
        <span>Search</span>
        <input id="search" type="text" placeholder="Song, artist, album or playlist" autocomplete="off">
      </label>

      <label class="field">
        <span>Sort by</span>
        <select id="sort">
          <option value="date-desc">Date added (new → old)</option>
          <option value="date-asc">Date added (old → new)</option>
          <option value="title">Title (A → Z)</option>
          <option value="artist">Artist (A → Z)</option>
          <option value="most-playlists">Most playlists first</option>
        </select>
      </label>

      <label class="field">
        <span>Added by</span>
        <select id="added-by">
          <option value="me">Added by me</option>
          <option value="others">Added by others</option>
          <option value="all">Everyone</option>
        </select>
      </label>

      <div class="field">
        <div class="tabs" role="tablist">
          <button class="tab active" id="tab-playlists" role="tab" aria-selected="true">Playlists</button>
          <button class="tab" id="tab-artists" role="tab" aria-selected="false">Artists</button>
        </div>
        <input id="artist-filter" type="text" placeholder="Find an artist" autocomplete="off" hidden>
        <ul class="playlist-list" id="playlist-list"></ul>
        <ul class="playlist-list artist-list" id="artist-list" hidden></ul>
      </div>
    </aside>

    <!-- MAIN PANEL: the song list -->
    <main class="panel main">
      <header class="main-header">
        <h2 id="heading">All Songs</h2>
        <p class="subtitle" id="subtitle">Loading…</p>
        <div class="main-actions">
          <button class="hero-btn primary" id="play-all" title="Play everything in this list, in order">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            Play
          </button>
          <button class="hero-btn outline" id="shuffle-all" title="Play everything in this list, in random order">
            <svg viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
            Shuffle
          </button>
        </div>
      </header>

      <div class="table">
        <div class="row head">
          <div class="cell">Title</div>
          <div class="cell album">Album</div>
          <div class="cell">Playlists</div>
          <div class="cell date">Date added</div>
        </div>

        <div class="rows" id="rows"></div>
      </div>
    </main>

    <!-- BOTTOM BAR: the player -->
    <footer class="player">
      <div class="np">
        <img class="np-cover" id="np-cover" alt="" hidden>
        <div class="np-text">
          <div class="np-title" id="np-title">Nothing playing</div>
          <div class="np-artist" id="np-artist"></div>
        </div>
      </div>

      <div class="center">
        <div class="controls">
          <button class="ctrl" id="btn-prev" aria-label="Previous song"></button>
          <button class="ctrl main" id="btn-play" aria-label="Play or pause"></button>
          <button class="ctrl" id="btn-next" aria-label="Next song"></button>
          <button class="ctrl" id="btn-repeat" aria-label="Repeat: off" title="Repeat: off"></button>
        </div>
        <div class="seek">
          <span class="time" id="time-now">0:00</span>
          <input class="slider" id="seek" type="range" min="0" max="0" value="0" step="1" aria-label="Seek" disabled>
          <span class="time" id="time-total">0:00</span>
        </div>
      </div>

      <div class="right">
        <div class="player-status" id="player-status">Connecting player…</div>
        <div class="volume">
          <button class="ctrl small" id="btn-mute" aria-label="Mute"></button>
          <input class="slider" id="volume" type="range" min="0" max="100" value="70" step="1" aria-label="Volume">
        </div>
      </div>
    </footer>

  </div>

  <!-- Order matters: app.js first (the others use it), then Spotify's own player code last -->
  <script src="/static/app.js"></script>
  <script src="/static/sync.js"></script>
  <script src="/static/player.js"></script>
  <script src="/static/queue.js"></script>
  <script src="https://sdk.scdn.co/spotify-player.js"></script>
</body>
</html>
