<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotify Pins</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">

    <!-- LEFT PANEL: filters -->
    <aside class="panel sidebar">
      <h1 class="logo">🎧 Spotify Pins</h1>

      <label class="field">
        <span>Search</span>
        <input id="search" type="text" placeholder="Song, artist, album or playlist" autocomplete="off">
      </label>

      <label class="field">
        <span>Sort by</span>
        <select id="sort">
          <option value="date-desc">Date added (new → old)</option>
          <option value="date-asc">Date added (old → new)</option>
          <option value="title">Title (A → Z)</option>
          <option value="artist">Artist (A → Z)</option>
          <option value="most-playlists">Most playlists first</option>
        </select>
      </label>

      <label class="field">
        <span>Added by</span>
        <select id="added-by">
          <option value="me">Added by me</option>
          <option value="others">Added by others</option>
          <option value="all">Everyone</option>
        </select>
      </label>

      <div class="field">
        <div class="tabs" role="tablist">
          <button class="tab active" id="tab-playlists" role="tab" aria-selected="true">Playlists</button>
          <button class="tab" id="tab-artists" role="tab" aria-selected="false">Artists</button>
        </div>
        <input id="artist-filter" type="text" placeholder="Find an artist" autocomplete="off" hidden>
        <ul class="playlist-list" id="playlist-list"></ul>
        <ul class="playlist-list artist-list" id="artist-list" hidden></ul>
      </div>
    </aside>

    <!-- MAIN PANEL: the song list -->
    <main class="panel main">
      <header class="main-header">
        <h2 id="heading">All Songs</h2>
        <p class="subtitle" id="subtitle">Loading…</p>
        <button class="play-all" id="play-all" title="Plays up to 100 songs from the top of this list">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          Play
        </button>
      </header>

      <div class="table">
        <div class="row head">
          <div class="cell">Title</div>
          <div class="cell album">Album</div>
          <div class="cell">Playlists</div>
          <div class="cell date">Date added</div>
        </div>

        <div class="rows" id="rows"></div>
      </div>
    </main>

    <!-- BOTTOM BAR: the player -->
    <footer class="player">
      <div class="np">
        <img class="np-cover" id="np-cover" alt="" hidden>
        <div class="np-text">
          <div class="np-title" id="np-title">Nothing playing</div>
          <div class="np-artist" id="np-artist"></div>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl" id="btn-prev" aria-label="Previous song"></button>
        <button class="ctrl main" id="btn-play" aria-label="Play or pause"></button>
        <button class="ctrl" id="btn-next" aria-label="Next song"></button>
      </div>

      <div class="player-status" id="player-status">Connecting player…</div>
    </footer>

  </div>

  <!-- Order matters: app.js first, then player.js, then Spotify's own player code -->
  <script src="/static/app.js"></script>
  <script src="/static/player.js"></script>
  <script src="https://sdk.scdn.co/spotify-player.js"></script>
</body>
</html>
